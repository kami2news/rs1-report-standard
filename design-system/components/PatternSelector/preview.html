<!-- @dsCard group="パターン" height=620 subtitle="報告の種類ごとの章立てを切り替えて確かめる" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
html,body{margin:0}
body{background:var(--surface);padding:24px}
.ps-tabs{display:flex;flex-wrap:wrap;gap:var(--space-2);margin:0 0 var(--space-4);padding:0;list-style:none}
.ps-tab{min-height:32px;padding:0 var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.ps-tab:hover{background:var(--surface-subtle)}
.ps-tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ps-tab:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (pointer:coarse){.ps-tab{min-height:44px}}
.ps-head{margin:0 0 var(--space-3);color:var(--ink-muted)}
.ps-list{margin:0;padding:0;list-style:none}
.ps-item{display:grid;grid-template-columns:5.5em 14em 1fr;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.ps-flag{justify-self:start;padding:0 var(--space-2);border:1px solid var(--ink);border-radius:var(--radius-sm)}
.ps-flag--req{background:var(--ink);color:var(--surface)}
.ps-flag--opt{background:var(--surface);color:var(--ink);border-style:dashed}
</style></head>
<body>
<div class="rp-doc">
  <ul class="ps-tabs" role="tablist" aria-label="報告の種類" id="tabs"></ul>
  <p class="ps-head t-caption" id="head"></p>
  <ol class="ps-list" id="list"></ol>
</div>
<script>
(function(){
  var P=[
    {k:"A",n:"実験・実習",size:"表紙＋A4 4〜8 枚",rows:[["表紙","req","実験日（曜日）・天候・気温・湿度・共同実験者"],["目的","req","自分の言葉で 1〜3 文"],["原理・背景","req","測定原理・式・前提"],["試料・装置・方法","req","実際にやった手順を過去形で"],["結果","req","測定値と図表だけ"],["考察","req","原理と比べ、誤差の原因まで"],["課題","opt","設問があれば番号付きで全部答える"],["結論","req","目的への答えを文で"],["参考文献","req",""],["付録","opt","生データ・計算過程"]]},
    {k:"B",n:"文献調査",size:"授業 2,000〜6,000 字",rows:[["表紙","opt","指示があれば"],["背景と問い","req","問いは 1〜3 個"],["調査方法","req","検索場所・語・期間・基準"],["文献の整理","req","軸ごとに分類して述べる"],["比較と考察","req","一致と食い違いの理由"],["結論と今後の課題","req","問いへの答え"],["参考文献","req",""],["付録　文献一覧表","opt","著者・年・対象・手法・結果"]]},
    {k:"C",n:"フィールド・観測",size:"巡検 A4 4〜10 枚",rows:[["表紙","req","調査日・天候"],["はじめに","req","背景と目的"],["調査地域","req","位置図と概況"],["方法","req","観測・採取、分析・処理、精度管理"],["結果","req","地点ごと・時期ごとの事実"],["考察","req","現地条件との関係と限界"],["課題","opt","設問があれば"],["結論","req","答えと次の観測"],["謝辞","opt","許可・協力"],["参考文献","req",""],["付録","opt","野帳・座標・欠測一覧"]]},
    {k:"D",n:"データ解析",size:"授業 A4 4〜10 枚",rows:[["表紙","opt","指示があれば"],["はじめに","req","背景と目的"],["データ","req","出典・版・取得日・範囲"],["手法・モデル","req","前処理・式・パラメータ"],["結果","req","同じ軸で比較できる図表"],["考察","req","不確実性と限界を含める"],["課題","opt","設問があれば"],["結論","req","答えと次の解析"],["参考文献","req",""],["付録　再現情報","req","環境・版・乱数の種・手順"]]},
    {k:"E",n:"ゼミのレジュメ",size:"A4 1〜2 枚",rows:[["ヘッダー","req","ゼミ名・発表日・発表者"],["要約（3 行）","req","E1：目的・現状・次にすること"],["目的と前回からの進み","req","E1：箇条書き"],["途中結果","req","E1：図表 1〜3 個"],["分かったこと・言えないこと","req","E1：分けて書く"],["相談したいこと","req","E1：1〜3 個"],["今後の予定","req","E1：日付と状態つき"],["要約と自分のコメント","req","E2（文献報告）：必ず見出しを分ける"],["スライドで発表","opt","表紙＝書誌情報、2 枚目＝問いと結論、図のスライド＝要約。見た目は KM1-DOC-003"]]},
    {k:"F",n:"卒業研究・論文",size:"学科の規定",rows:[["表紙","req","学科の様式"],["要旨（和・英）","req","和文 600〜800 字"],["目次","req",""],["序論","req","背景・先行研究・目的・構成"],["調査地域・対象","req",""],["試料・データ・方法","req","他の型の方法を節にする"],["結果","req","節ごとに 1 つの問い"],["考察","req","最後に全体の議論"],["結論","req","問いと答えが 1 対 1"],["謝辞","req",""],["参考文献","req",""],["付録","opt",""]]},
    {k:"G",n:"論述",size:"2,000〜4,000 字",rows:[["簡易ヘッダー","req","科目名・学籍番号・氏名と表題"],["序論","req","問い・結論の予告（約 10%）"],["本論　根拠 1","req","主張 → 根拠 → 説明"],["本論　根拠 2","req","1 章に根拠 1 つ"],["反論への応答","req","違う立場を紹介し答える"],["結論","req","問いへの答え・限界（10〜20%）"],["参考文献","req",""],["総文字数","opt","指示があれば文末に"]]},
    {k:"H",n:"小レポート",size:"400〜1,600 字",rows:[["簡易ヘッダー","req","科目名・回・学籍番号・氏名"],["問いと答え","req","1 段落目で答えを言い切る"],["根拠","req","1 段落に 1 つ、2〜3 段落"],["まとめ","req","答えを言い直す"],["参考文献","opt","授業資料以外を使ったとき"],["総文字数","opt","指示があれば文末に"]]}
  ];
  var tabs=document.getElementById("tabs"),head=document.getElementById("head"),list=document.getElementById("list");
  function show(i){
    var p=P[i];
    Array.prototype.forEach.call(tabs.children,function(li,j){li.firstChild.setAttribute("aria-selected",j===i?"true":"false");li.firstChild.tabIndex=j===i?0:-1;});
    head.textContent="パターン "+p.k+"　"+p.n+"　／　分量の目安 "+p.size;
    list.innerHTML="";
    var num=0;
    p.rows.forEach(function(r){
      var li=document.createElement("li");li.className="ps-item t-caption";
      var f=document.createElement("span");f.className="ps-flag t-meta ps-flag--"+r[1];f.textContent=r[1]==="req"?"必須":"任意";
      var a=document.createElement("span");a.textContent=r[0];
      var b=document.createElement("span");b.style.color="var(--ink-muted)";b.textContent=r[2];
      li.appendChild(f);li.appendChild(a);li.appendChild(b);list.appendChild(li);
    });
  }
  P.forEach(function(p,i){
    var li=document.createElement("li"),b=document.createElement("button");
    b.type="button";b.className="ps-tab t-meta";b.setAttribute("role","tab");b.textContent=p.k+"　"+p.n;
    b.addEventListener("click",function(){show(i);});
    b.addEventListener("keydown",function(e){
      var n=-1;
      if(e.key==="ArrowRight")n=(i+1)%P.length;else if(e.key==="ArrowLeft")n=(i+P.length-1)%P.length;
      if(n>=0){show(n);tabs.children[n].firstChild.focus();e.preventDefault();}
    });
    li.appendChild(b);tabs.appendChild(li);
  });
  show(0);
})();
</script>
</body></html>
