<!-- @dsCard group="図表・式" height=330 subtitle="式は中央、式番号は右端。記号の説明を続ける" -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>html,body{margin:0}body{background:var(--surface);padding:24px}</style></head>
<body>
<div class="rp-doc">
  <p class="t-body">検量線の傾きと切片から、試料の濃度を式 (1) で求めた。</p>
  <div class="rp-eq t-body">
    <div class="rp-eq-body"><i>C</i> = (<i>A</i> − <i>b</i>) / <i>a</i></div>
    <div class="rp-eq-no"></div>
  </div>
  <p class="t-caption">ここで、<i>C</i> は濃度 (mg/L)、<i>A</i> は吸光度（無次元）、<i>a</i> は検量線の傾き (L/mg)、<i>b</i> は切片（無次元）。</p>
  <p class="t-body">繰り返し測定の相対誤差は式 (2) で評価した。</p>
  <div class="rp-eq t-body">
    <div class="rp-eq-body"><i>e</i> = |<i>x</i> − <i>x</i><sub>ref</sub>| / <i>x</i><sub>ref</sub> × 100</div>
    <div class="rp-eq-no"></div>
  </div>
  <p class="t-caption">ここで、<i>e</i> は相対誤差 (%)、<i>x</i> は測定値、<i>x</i><sub>ref</sub> は基準値。</p>
</div>
</body></html>
