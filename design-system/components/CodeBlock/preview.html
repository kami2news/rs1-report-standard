  <div class="rp-code">
    <p class="rp-code-cap t-caption"><b>コード 1</b>　電気伝導度の 25 ℃換算（Python 3.12、pandas 2.2）</p>
<pre class="t-code"><code>import pandas as pd

ALPHA = 0.02  # 温度補償係数 (1/℃)

df = pd.read_csv("water.csv")
df["ec25"] = df["ec"] / (1 + ALPHA * (df["temp"] - 25))
print(df[["site", "ec25"]].round(1))</code></pre>
