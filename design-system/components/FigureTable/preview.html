<!doctype html>

<div class="rp-doc">

      <g class="rp-s2"><rect x="52" y="124" width="8" height="8"/><rect x="152" y="134" width="8" height="8"/><rect x="252" y="72" width="8" height="8"/><rect x="352" y="56" width="8" height="8"/><rect x="452" y="108" width="8" height="8"/></g>
